name: "💡 Idea / Richiesta"
description: "Suggest a feature · Proponi una funzione"
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: "Your idea · La tua idea"
      description: "What would help you on stage, in rehearsal or at home? · Cosa ti aiuterebbe sul palco, in sala prove o a casa?"
    validations:
      required: true
  - type: dropdown
    id: pedal
    attributes:
      label: "Pedal / Pedale"
      options: ["MS-50G+", "MS-60B+", "MS-70CDR+", "MS-80IR+", "MS-200D+", "G2 FOUR / G2X FOUR", "B2 FOUR", "G6", "G11", "B6", "Any / Tutti"]
